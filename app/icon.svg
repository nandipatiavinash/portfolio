<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#0a0a0b" />
    </radialGradient>
    
    <!-- Premium Bronze Accent Gradient -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd0b8" />
      <stop offset="50%" stop-color="#c9b99a" />
      <stop offset="100%" stop-color="#a49377" />
    </linearGradient>
    
    <!-- Subtle Inner Shadow/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1f1f23" stroke-width="8" />

  <!-- Geometric Symbol: Stylized Minimalist Monogram / Code Chevron -->
  <g transform="translate(256, 256) scale(1.15)" filter="url(#glow)">
    <!-- Outer Orbit Ring (Dotted/Subtle) -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#2a2a2f" stroke-width="4" stroke-dasharray="8 8" />
    
    <!-- Central Geometric "A" / Orbit Apex -->
    <path d="M-60 70 L0 -70 L60 70" fill="none" stroke="url(#bronzeGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Horizontal Crossbar / Bridge -->
    <path d="M-30 15 L30 15" fill="none" stroke="url(#bronzeGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Inner Core Dot -->
    <circle cx="0" cy="-10" r="18" fill="#ffffff" />
  </g>
</svg>
